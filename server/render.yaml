# Render.com Blueprint — deploys the backend as a free-tier web service.
# Push this file to the repo root or apply via Render dashboard "Blueprints".
#
# Free tier notes:
#   - SQLite via the `disk:` mount survives restarts but Render's free tier
#     wipes the disk on plan downgrade. For a long-lived demo migrate to
#     Render's free Postgres (1GB).
#   - Free instances spin down after 15 min of inactivity; first request
#     after wake-up takes ~30 sec.

services:
  - type: web
    name: svitgo-api
    env: node
    plan: free
    region: frankfurt
    rootDir: server
    # Build = install deps + push schema + compile. Seeding is SEPARATE
    # and intentionally NOT in the build step — seed.ts does `deleteMany()`
    # on every model before re-seeding, which would wipe real user data
    # on every deploy. To run the initial seed: `npm run db:seed:bootstrap`
    # ONCE from the Render shell after the disk is provisioned. Subsequent
    # deploys keep the data.
    buildCommand: npm install && npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./data/prod.db
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a stable secret
      - key: CORS_ORIGIN
        # Paste your Vercel URL here after first deploy:
        value: https://svitgo.vercel.app
      - key: OPENAI_API_KEY
        sync: false                # set manually in dashboard (private key)
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    disk:
      name: svitgo-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
